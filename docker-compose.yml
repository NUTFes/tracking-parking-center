services:
  db:
    image: mysql:9.2.0
    platform: linux/amd64
    container_name: trapa-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tracking_parking}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-trapa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trapa_password}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./services/api
    container_name: trapa-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://trapa:trapa_password@db:3306/tracking_parking}
      DEVICE_OFFLINE_THRESHOLD_SECONDS: ${DEVICE_OFFLINE_THRESHOLD_SECONDS:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-client-id.apps.googleusercontent.com}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./services/web
    container_name: trapa-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-your-client-id.apps.googleusercontent.com}
    volumes:
      - ./services/web:/app
      - /app/node_modules
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  admin-web:
    build:
      context: ./services/admin-web
    container_name: trapa-admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-5174}:5174"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-your-client-id.apps.googleusercontent.com}
    volumes:
      - ./services/admin-web:/app
      - /app/node_modules
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"

volumes:
  db-data:
    name: trapa-db-data
